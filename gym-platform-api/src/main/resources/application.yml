spring:
  profiles:
    active: development
  logging:
    level:
      org.springframework.security: DEBUG
  datasource:
    url: jdbc:postgresql://${postgres.url}/${postgres.schema}
    username: ${postgres.username}
    password: ${postgres.password}
    hikari:
      auto-commit: false
      connection-timeout: 250 # Em ms. Manter baixo para estourar timeout rápido e não prender as threads.
      max-lifetime: 600000 # Tempo máximo que uma conexão pode ficar aberta (10 min) - segurança.
      maximum-pool-size: 20 # Máx 20 conexões com o banco. Manter baixo, pois é custoso para o banco gerenciar.
      minimum-idle: 10
      pool-name: master
  jpa:
    open-in-view: false
    show-sql: true
    hibernate:
      ddl-auto: none
    properties:
      "[hibernate.dialect]": org.hibernate.dialect.PostgreSQLDialect
      "[hibernate.generate_statistics]": false
      "[hibernate.connection.provider_disables_autocommit]": true
      # Para aumentar a performance ao máximo, desabilitamos o auto-commit e o open-in-view.
      # https://vladmihalcea.com/why-you-should-always-use-hibernate-connection-provider_disables_autocommit-for-resource-local-jpa-transactions/

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
  prometheus:
    metrics:
      export:
        enabled: true

security:
  auth:
    jwt:
      issuer: gym-platform-api
      secret: ${JWT_SECRET:da960d0f49a24688ad5cc5a3e787fd03da960d0f49a24688ad5cc5a3e787fd03}
      expirationMinutes: 120
    bootstrap:
      enabled: true
      fullName: Gym Admin
      email: admin@gym.io
      password: changeit
      roles:
        - ADMIN

app:
  cors:
    allowed-origins:
      - http://localhost:5173
      - http://127.0.0.1:5173
      - http://localhost:8081
      - http://127.0.0.1:8081
    allowed-methods:
      - GET
      - POST
      - PUT
      - PATCH
      - DELETE
      - OPTIONS
    allowed-headers:
      - "*"
    allow-credentials: true