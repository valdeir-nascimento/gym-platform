version: "3.8"

services:
  postgres:
    image: postgres:16
    container_name: gym_platform_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: gym_platform
      POSTGRES_USER: gym_user
      POSTGRES_PASSWORD: gym_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gym_user -d gym_platform"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
